name: Bug report
description: Report something that is not working as expected
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and the steps that reproduce it.
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: Describe what you expected to happen.
  - type: dropdown
    id: installation
    attributes:
      label: How are you running it?
      options:
        - docker compose
        - npm
        - other
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Include any relevant logs, with secrets removed.
      render: shell
